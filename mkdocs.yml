site_name: IoT & Home Automation
site_url: https://iot.elena.re
site_dir: public
docs_dir: ./docs
repo_url: https://github.com/alinelena/iot
repo_name: alinelena/iot
copyright: Ⓒ 2020–2026 Alin M. Elena
site_author: Alin M. Elena
site_description: Custom LEGO-compatible IoT multisensor boards, ESPHome e-paper firmware, Home Assistant automations, and environmental telemetry

theme:
  name: material
  language: en
  logo: pics/mlego.webp
  favicon: pics/mlego.webp
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/48broadbent
      name: 48Broadbent on GitLab
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/m-lego
      name: m-lego on GitLab
    - icon: fontawesome/brands/github
      link: https://github.com/alinelena
      name: Alin M. Elena on GitHub
    - icon: material/web
      link: https://alin.elena.re
      name: Personal Website & Blog

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: true
      caption_position: bottom

nav:
  - Home: index.md
  - Hardware:
    - Overview: hardware/index.md
    - Sensor Carrier (12×6): hardware/sensor-12x6.md
    - Mini Sensor (8×6): hardware/sensor-1.54.md
    - LEGO Mounting & CAD: hardware/lego-mounting.md
  - ESPHome Fleet:
    - Fleet Overview: esphome/index.md
    - E-Paper Displays & Drivers: esphome/epaper-guide.md
    - Node Catalog: esphome/nodes.md
    - Firmware Architecture: esphome/firmware-examples.md
  - Home Assistant:
    - Overview: homeassistant/index.md
    - Automation Blueprints: homeassistant/blueprints.md
  - Guides:
    - Assembly & Soldering: guides/assembly.md
    - Pinout Reference: guides/pinouts.md
    - Flashing & OTA: guides/flashing-ota.md

